<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <script>
    if (typeof window !== 'undefined' && typeof document !== 'undefined') {
      try {
        const savedTheme = window.localStorage.getItem('fernando-portfolio-theme');
        document.documentElement.setAttribute('data-theme', savedTheme === 'light' ? 'light' : 'dark');
      } catch {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    }
  </script>
  <title>Fernando Elizondo | Desarrollador Full Stack</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070b">
  <meta name="description" content="Portafolio profesional de Fernando Elizondo, desarrollador Full Stack especializado en React, TypeScript, Node.js, Express y MySQL.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
  <app-root></app-root>
</body>
</html>
